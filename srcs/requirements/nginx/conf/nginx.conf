events {}

http {
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name rdelicad.42.fr;

        ssl_certificate /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        index index.html;  # Changed to index.html for simplicity
        root /var/www/html;

        location / {
            try_files $uri $uri/ =404;  # Simplified for static content
        }

        # Commented out PHP configuration for now
        # location ~ \.php$ {
