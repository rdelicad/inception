<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspiración y Diseño</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f8ff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            max-width: 600px;
        }
        .quote {
            font-size: 20px;
            font-style: italic;
            color: #333;
            margin-bottom: 15px;
        }
        .image-container img {
            width: 100%;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="quote">
            "La creatividad es la inteligencia divirtiéndose." - Albert Einstein
        </div>
        <div class="image-container">
            <img src="https://images.unsplash.com/photo-1506748686214e9df14f8d7b9c91d0ffb5f85f3d3e6b?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=MnwyNTg1Mzh8MHwxfGFsbHwxfHx8fHx8fHwxNjcwNTg4NDY5&ixlib=rb-1.2.1&q=80&w=1080" alt="inspirational_image">
        </div>
    </div>
</body>
</html>
