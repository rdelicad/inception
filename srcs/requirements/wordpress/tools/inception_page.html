<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inception</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 80%;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .title {
            font-size: 36px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }
        .subtitle {
            font-size: 20px;
            font-style: italic;
            color: #666;
            margin-bottom: 25px;
        }
        .image-container img {
            width: 100%;
            border-radius: 8px;
            max-height: 500px;
            object-fit: cover;
            margin-bottom: 20px;
        }
        .description {
            font-size: 18px;
            color: #444;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">Inception</div>
        <div class="subtitle">"La realidad es solo una ilusión, aunque una muy persistente."</div>
        <div class="image-container">
            <img src="https://images.unsplash.com/photo-1519745577048-6d12c3b40960?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=MnwyNTg1Mzh8MHwxfGFsbHwxfHx8fHx8fHwxNjcwNTg4NDY5&ixlib=rb-1.2.1&q=80&w=1080" alt="Inception Image">
        </div>
        <div class="description">
            Explora el mundo de los sueños y la mente humana con una nueva perspectiva sobre la realidad. Cada capa de la mente tiene sus propios secretos esperando ser descubiertos.
        </div>
    </div>
</body>
</html>
