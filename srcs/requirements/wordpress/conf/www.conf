; Start a new pool named 'www'
[www]

; Unix user/group of processes
user = www-data
group = www-data

; The address on which to accept FastCGI requests.
; Valid values are:
;  - a Unix socket
;  - an IP address, optionally with a port number
; Default is to listen on a Unix socket.
listen = 9000

; Set the permissions for the Unix socket
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Set the maximum number of simultaneous requests to the FastCGI server
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; PHP-FPM can run in several process management modes
; 'static' - number of processes is fixed
; 'dynamic' - number of processes is dynamic
; 'ondemand' - number of processes is dynamically adjusted
pm = dynamic

; The amount of time a child process may spend serving a request before being terminated
pm.process_idle_timeout = 10s

; Set the maximum number of requests a single child process should handle before being respawned
pm.max_requests = 500

